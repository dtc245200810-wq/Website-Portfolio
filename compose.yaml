services:
  # 1. Helper to initialize logs volume with proper ownership
  init-logs:
    image: busybox:1.37.0
    container_name: portfolio-init-logs
    command: >
      sh -c "
        mkdir -p /logs/app /logs/nginx &&
        touch /logs/app/app.log /logs/nginx/access.log /logs/nginx/error.log &&
        chown -R 1000:1000 /logs/app &&
        chown -R 101:101 /logs/nginx &&
        chmod 644 /logs/app/app.log /logs/nginx/access.log /logs/nginx/error.log &&
        echo 'Logs initialized successfully'
      "
    volumes:
      - portfolio_app_logs:/logs/app
      - portfolio_nginx_logs:/logs/nginx
    restart: "no"

  # 2. MySQL 8.0 Database (Hardened: Internal network, no host port exposed)
  mysql:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=150
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@2026!PortfolioSecure}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio_db}
      MYSQL_USER: ${MYSQL_USER:-portfolio_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-PortfolioApp@2026!Secure}
    volumes:
      - portfolio_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - portfolio_database_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 3. phpMyAdmin Administration Tool (Bound strictly to localhost)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: portfolio-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-portfolio_app}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-PortfolioApp@2026!Secure}
      UPLOAD_LIMIT: 64M
    networks:
      - portfolio_database_network
      - portfolio_management_network
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Portfolio Node.js Application (Hardened: Non-root UID 1000, read-only rootfs, tmpfs)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: portfolio-app:latest
    container_name: portfolio-app
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio_db}
      MYSQL_USER: ${MYSQL_USER:-portfolio_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-PortfolioApp@2026!Secure}
      SESSION_SECRET: ${SESSION_SECRET:-SecureRandomSecretKey2026PortfolioSystem}
      LOG_DIR: /app/logs
    volumes:
      - portfolio_app_logs:/app/logs
    networks:
      - portfolio_web_network
      - portfolio_database_network
      - portfolio_monitoring_network
    depends_on:
      mysql:
        condition: service_healthy
      init-logs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 5. Nginx Reverse Proxy (HTTPS RSA 3072 bit, TLS 1.2/1.3, Security Headers)
  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${HOST_HTTPS_PORT:-8443}:443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - portfolio_nginx_logs:/var/log/nginx
    networks:
      - portfolio_web_network
      - portfolio_monitoring_network
    depends_on:
      app:
        condition: service_healthy

networks:
  portfolio_web_network:
    name: portfolio_web_network
    driver: bridge
  portfolio_database_network:
    name: portfolio_database_network
    driver: bridge
    internal: true # Hardening: Isolated network without external internet gateway
  portfolio_management_network:
    name: portfolio_management_network
    driver: bridge
  portfolio_monitoring_network:
    name: portfolio_monitoring_network
    driver: bridge

volumes:
  portfolio_mysql_data:
    name: portfolio_mysql_data
  portfolio_app_logs:
    name: portfolio_app_logs
  portfolio_nginx_logs:
    name: portfolio_nginx_logs
