# ========================================================
# Promtail Configuration for Log Scraping and Shipping
# ========================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Scrape Nginx JSON Access & Error Logs
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: portfolio-nginx
          env: production
          __path__: /logs/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            client_ip: client_ip
            method: method
            uri: uri
            status: status
            request_time: request_time
      - timestamp:
          source: timestamp
          format: RFC3339

  # 2. Scrape Application JSON Runtime Logs
  - job_name: app
    static_configs:
      - targets:
          - localhost
        labels:
          job: app
          service: portfolio-app
          env: production
          __path__: /logs/app/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event: event
            message: message
            ip: ip
            user: user
      - timestamp:
          source: timestamp
          format: RFC3339
