# ========================================================
# Nginx Reverse Proxy Configuration with HTTPS & Hardening
# Author: To Vu Dat (DTC245200810 - CNTT K23I)
# ========================================================

# Custom JSON access log format for Promtail & Loki ingestion
log_format json_combined escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
  '}';

upstream portfolio_backend {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP Server (Port 80) -> Redirect 301 to HTTPS (Port 8443)
server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# 2. HTTPS Server (Port 443)
server {
    listen 443 ssl;
    http2 on;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # SSL / TLS Certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS Protocols & Ciphers (Hardening)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (Hardening)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request limits
    client_max_body_size 5M;

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://portfolio_backend;
        proxy_http_version 1.1;

        # Prevent duplicate headers by hiding upstream duplicates
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        # Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;

        # Connection keepalive
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# 3. Internal Metrics Server (Port 8082 for Nginx Exporter)
server {
    listen 8082;
    server_name 127.0.0.1;
    server_tokens off;

    location /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
