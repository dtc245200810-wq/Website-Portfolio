services:
  # 1. Prometheus Server (Time-series metrics engine)
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: portfolio-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${HOST_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - portfolio_prometheus_data:/prometheus
    networks:
      - portfolio_monitoring_network
      - portfolio_web_network
      - portfolio_database_network

  # 2. cAdvisor (Container Resource Usage Exporter)
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: portfolio-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - portfolio_monitoring_network

  # 3. Nginx Prometheus Exporter (Web Traffic & Connections)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: portfolio-nginx-exporter
    restart: unless-stopped
    command:
      - "-nginx.scrape-uri=http://nginx:8082/stub_status"
    networks:
      - portfolio_web_network
      - portfolio_monitoring_network
    depends_on:
      - nginx

  # 4. MySQL Prometheus Exporter (Database Activity & Connections)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: portfolio-mysqld-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "mysqld_exporter:${MYSQL_EXPORTER_PASSWORD:-Exporter@2026!Secure}@(mysql:3306)/"
    networks:
      - portfolio_database_network
      - portfolio_monitoring_network
    depends_on:
      mysql:
        condition: service_healthy

  # 5. Grafana Visual Dashboard (Provisioned datasources & dashboards)
  grafana:
    image: grafana/grafana:11.5.0
    container_name: portfolio-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-Admin@2026!GrafanaSecure}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3002"
    volumes:
      - portfolio_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - portfolio_monitoring_network
    depends_on:
      - prometheus

volumes:
  portfolio_prometheus_data:
    name: portfolio_prometheus_data
  portfolio_grafana_data:
    name: portfolio_grafana_data
